<style>
:root {
  --bg:#0a0a0a;
  --g:#d4af37;
  --l:#f3d77a;
  --d:#6b5a22;
  --t:#f2ead3;
  --muted:#b9b6a8;
  --ice:#86baff;
  --teal:#65d9cb;
  --coral:#ff8b78
}
* {
  box-sizing:border-box;
  margin:0
}
body {
  background:var(--bg);
  color:var(--t);
  font:700 15px/1.45 "Courier New",ui-monospace,monospace;
  letter-spacing:.04em;
  min-height:100vh;
  min-height:100svh
}
button {
  font:inherit;
  color:var(--t);
  background:#161616;
  border:3px solid var(--d);
  padding:10px 12px;
  min-height:48px;
  box-shadow:3px 3px 0 #000;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:.04em
}
button:active {
  transform:translate(2px,2px);
  box-shadow:1px 1px 0 #000
}
button.on,button.go {
  border-color:var(--g);
  color:var(--l)
}
button.go {
  background:#2a2108
}
input {
  font:inherit;
  background:#111;
  color:var(--t);
  border:3px solid var(--d);
  padding:8px;
  width:100%
}
.dot {
  position:fixed;
  top:calc(10px + env(safe-area-inset-top,0px));
  right:calc(10px + env(safe-area-inset-right,0px));
  width:12px;
  height:12px;
  background:#555;
  z-index:5
}
.dot.ok {
  background:#5ad17a
}
.dot.bad {
  background:#e5484d
}
#sync {
  position:fixed;
  top:7px;
  right:27px;
  z-index:5;
  font:14px/20px system-ui,sans-serif;
  color:#ddd;
  background:#111b;
  padding:1px 6px;
  border-radius:3px
}
body.host #sync {
  position:sticky;
  top:0;
  right:auto;
  display:block;
  min-height:26px;
  padding:calc(4px + env(safe-area-inset-top,0px)) calc(30px + env(safe-area-inset-right,0px)) 4px 20px;
  max-width:100%;
  text-align:right;
  overflow-wrap:anywhere;
  background:var(--bg)
}
body.tv #H,body:not(.tv) #T {
  display:none
}
body:not(.tv) #tvAudio {
  display:none
}
#tvAudio {
  position:fixed;
  bottom:max(12px,env(safe-area-inset-bottom,0px));
  left:max(16px,env(safe-area-inset-left,0px));
  z-index:6;
  display:block;
  gap:6px;
  align-items:flex-start;
  font:clamp(12px,1.4vh,16px)/1.4 system-ui,sans-serif;
  text-align:left
}
#tvAudio button,#tvAudio summary {
  font:inherit;
  padding:8px 10px;
  min-height:44px;
  min-width:44px;
  letter-spacing:0;
  text-transform:none;
  border:1px solid var(--d);
  background:#111e;
  box-shadow:none;
  color:var(--muted);
  cursor:pointer
}
#tvAudio button[aria-pressed="true"] {
  border-color:var(--teal);
  color:var(--teal)
}
#tvAudio details {
  margin:0;
  position:relative
}
#tvAudio .tone-tests {
  position:static;
  width:100%;
  background:#111;
  padding:8px;
  border:1px solid var(--d);
  display:grid;
  gap:6px
}
#tvAudio .tone-tests small {
  color:var(--muted)
}
/* chooser */
body.landing #H {
  max-width:none;
  min-height:100vh;
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))
}
body.landing .dot {
  display:none
}
.chooser {
  text-align:center;
  width:min(100%,520px)
}
.chooser h1 {
  color:var(--l);
  font-size:clamp(25px,5vw,42px);
  margin:15px 0 20px;
  text-shadow:2px 2px 0 var(--d)
}
.chooser .rw {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  justify-content:center;
  gap:12px
}
.chooser button {
  min-width:0;
  min-height:60px;
  width:100%;
  padding:15px 18px
}
.chooser .back-menu {
  display:inline-flex;
  align-items:center;
  color:var(--muted);
  font-size:12px;
  margin-bottom:20px;
  text-decoration:none;
  min-height:44px
}
.chooser .chooser-intro {
  font-size:14px;
  line-height:1.6;
  color:var(--muted);
  font-weight:400;
  margin:0 auto 18px;
  max-width:380px
}
.title-icons {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:30px;
  margin:0 auto 12px
}
.title-side {
  width:78px;
  flex:none
}
.title-side svg {
  display:block;
  width:100%;
  height:auto;
  shape-rendering:crispEdges
}
.title-middle {
  width:144px;
  display:grid;
  place-items:center;
  flex:none
}
#T .title-side {
  width:12vh
}
#T .title-middle {
  width:18vh
}
#T .title-middle svg {
  width:100%;
  height:auto
}
.tree-light {
  animation:tree-twinkle 2.4s steps(2) infinite alternate;
  animation-delay:calc(var(--i)*.22s)
}
.santa-wave {
  transform-origin:14px 11px;
  animation:santa-wave 3s steps(3) infinite
}
@keyframes tree-twinkle {
  to {
    opacity:.4;
    fill:#fff4be
  }
}
@keyframes santa-wave {
  0%,55%,100% {
    transform:none
  }
  15%,35% {
    transform:translateY(-1px) rotate(-12deg)
  }
  25%,45% {
    transform:rotate(8deg)
  }
}
@media(max-width:440px) {
  .title-icons {
    gap:16px
  }
  .title-side {
    width:56px
  }
  .title-middle {
    width:112px
  }
  .title-middle .pixel-abacus {
    width:112px;
    height:90px
  }
}
.pixel-abacus {
  width:144px;
  height:116px;
  shape-rendering:crispEdges;
  filter:drop-shadow(5px 5px 0 #000)
}
.bead-one {
  animation:slide-one 1.8s steps(3) infinite alternate
}
.bead-two {
  animation:slide-two 2.3s steps(4) infinite alternate
}
.bead-three {
  animation:slide-three 2.7s steps(4) infinite alternate
}
@keyframes slide-one {
  to {
    transform:translateX(4px)
  }
}
@keyframes slide-two {
  to {
    transform:translateX(6px)
  }
}
@keyframes slide-three {
  to {
    transform:translateX(3px)
  }
}
.host-icon {
  display:inline-flex;
  vertical-align:middle;
  align-items:center;
  margin-right:8px
}
.host-icon svg {
  animation:tally-tick 1.2s steps(2) infinite;
  transform-origin:bottom left
}
@keyframes tally-tick {
  50% {
    transform:rotate(-10deg)
  }
}
.soundbar {
  display:flex;
  align-items:stretch;
  flex-wrap:wrap;
  gap:10px;
  margin:7px 0 12px
}
.soundbar button {
  padding:12px 14px;
  font-size:14px;
  min-height:48px;
  flex:1 1 160px;
  white-space:nowrap
}
.soundbar button.sound-on {
  border-color:var(--teal);
  color:var(--teal)
}
.champion-prize {
  border:1px solid var(--d);
  background:#211b0c;
  padding:8px 10px;
  color:var(--l);
  font-size:13px
}
.champion-prize small {
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:400;
  margin-top:2px
}
.prize-label {
  color:var(--l)
}
.chooser .prize-label {
  font-size:14px;
  margin:-8px 0 20px
}
#T .prize-label {
  font-size:2.6vh
}
.spot-prize .cash-prize {
  gap:1.2vw
}
.spot-prize .cash-prize svg {
  width:clamp(54px,10vh,110px)
}
.spot-prize .cash-prize .cash-amount {
  font-size:clamp(28px,5vh,65px);
  color:var(--l)
}
/* host */
#H {
  max-width:860px;
  margin:auto;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))
}
.hd {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  color:var(--g);
  font-size:17px;
  margin-bottom:10px
}
.lb {
  color:var(--muted);
  font-size:12px;
  margin:12px 0 6px
}
.sm {
  color:var(--muted);
  font-size:14px;
  line-height:1.5
}
.rw,.gd,.tabs {
  display:flex;
  flex-wrap:wrap;
  gap:8px
}
.gd button {
  flex:1 1 30%
}
.tabs {
  display:grid;
  grid-template-columns:repeat(9,minmax(44px,1fr))
}
.tabs button {
  padding:10px 0;
  min-height:48px
}
@media(max-width:500px) {
  .tabs {
    grid-template-columns:repeat(5,minmax(44px,1fr))
  }
}
.card {
  border:3px solid var(--g);
  padding:14px;
  margin-top:12px;
  box-shadow:5px 5px 0 #000,5px 5px 0 1px var(--d)
}
.card h2 {
  color:var(--l);
  margin:4px 0
}
.card p {
  color:#cfc6a8;
  font-weight:400;
  font-size:16px;
  line-height:1.55;
  margin-bottom:6px
}
.msg {
  color:var(--l);
  margin-top:8px
}
details {
  margin-top:14px
}
summary {
  cursor:pointer;
  min-height:48px;
  padding:12px 0;
  line-height:1.5;
  color:var(--g)
}
.nr {
  display:grid;
  grid-template-columns:1fr auto auto auto;
  gap:6px;
  align-items:center;
  margin-top:6px
}
.nr button {
  padding:8px;
  min-width:44px;
  width:44px;
  min-height:48px
}
.clock {
  font-size:clamp(30px,8vw,58px);
  color:var(--teal);
  font-variant-numeric:tabular-nums;
  margin:8px 0
}
.turn {
  border:2px solid var(--d);
  padding:12px;
  margin:10px 0;
  background:#111
}
.turn .rw button {
  flex:1 1 190px;
  min-height:48px
}
.turn .rw button.timer-primary {
  min-height:76px;
  font-size:18px;
  line-height:1.35;
  padding:16px 14px;
  touch-action:manipulation
}
.turn .rw button.timer-reset {
  flex:0 1 auto;
  font-size:13px;
  min-height:44px
}
.results {
  display:grid;
  gap:7px;
  margin-top:10px
}
.result {
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(104px,150px) auto;
  align-items:center;
  gap:8px;
  padding:10px 0;
  border-bottom:1px solid #332e1f
}
.result input {
  font-variant-numeric:tabular-nums
}
.result b {
  min-width:52px;
  text-align:right;
  color:var(--l)
}
.result .who {
  overflow-wrap:anywhere;
  font-size:16px;
  line-height:1.45
}
.hint {
  color:#cfc6a8;
  font-size:14px;
  line-height:1.5;
  font-weight:400;
  margin-top:8px
}
.warn {
  color:var(--coral);
  margin-top:8px
}
@media(max-width:440px) {
  .result {
    grid-template-columns:minmax(0,1fr) 100px auto
  }
  .result b {
    min-width:34px
  }
}
.hostcheck {
  font-weight:400;
  color:#cfc6a8;
  padding:4px 0 8px
}
/* tv */
#T {
  height:100vh;
  padding:3vh 4vw;
  text-align:center
}
#msg {
  height:100%;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2.4vh
}
#msg.spotlight {
  border:1vh solid var(--g);
  background:radial-gradient(circle at 50% 42%,#2b220d 0%,#0a0a0a 68%);
  padding:3vh 4vw;
  gap:2vh
}
#msg.spotlight.trophy {
  border-color:var(--coral);
  background:radial-gradient(circle at 50% 42%,#341c19 0%,#0a0a0a 68%)
}
#msg.spotlight h1 {
  font-size:clamp(46px,10vh,130px);
  line-height:1.02;
  letter-spacing:.08em
}
#msg.spotlight .spot-name {
  font-size:clamp(42px,9vh,120px);
  line-height:1.1;
  color:#fff;
  text-shadow:.7vh .7vh 0 #000;
  overflow-wrap:anywhere
}
#msg.spotlight .spot-rank {
  font-size:clamp(20px,4vh,48px);
  color:var(--g);
  letter-spacing:.18em
}
#msg.spotlight.trophy .spot-rank {
  color:var(--coral)
}
#msg.spotlight .spot-icon svg {
  width:min(17vh,170px);
  height:auto;
  animation:spot-bob 1.2s steps(3) infinite alternate
}
@keyframes spot-bob {
  to {
    transform:translateY(-1vh) rotate(5deg)
  }
}
#msg.rules {
  gap:1.3vh;
  padding:1vh 0
}
#msg.timer-view {
  gap:2vh;
  padding:2vh 3vw;
  border:.5vh solid var(--teal);
  background:radial-gradient(ellipse at center,#102722,#0a0a0a 72%)
}
#msg.timer-view h1 {
  font-size:clamp(28px,5.7vh,76px);
  line-height:1.1
}
#msg.timer-view .timer-team {
  font-size:clamp(24px,4vh,52px);
  color:var(--teal)
}
#msg.timer-view .timer-names {
  font-size:clamp(18px,2.8vh,36px);
  max-width:86vw;
  overflow-wrap:anywhere;
  font-weight:400
}
#tvClock {
  font-size:clamp(100px,24vh,300px);
  line-height:1;
  font-variant-numeric:tabular-nums;
  letter-spacing:.03em;
  color:var(--teal);
  text-shadow:.8vh .8vh 0 #000
}
#tvClockPhase {
  font-size:clamp(24px,4vh,52px);
  color:var(--l);
  min-height:5vh
}
#tvClockHint {
  font-size:clamp(18px,3vh,40px);
  font-weight:400;
  max-width:84vw
}
.tv-clock-track {
  width:80vw;
  max-width:1100px;
  height:2.2vh;
  border:.3vh solid var(--d);
  background:#111
}
#tvClockBar {
  height:100%;
  background:var(--teal);
  transition:width .1s linear
}
#msg.timer-view.urgent #tvClock {
  color:var(--coral)
}
#msg.timer-view.urgent #tvClockBar {
  background:var(--coral)
}
#msg.timer-view.ended {
  border-color:var(--coral)
}
#msg.timer-view.ended #tvClockPhase {
  color:var(--coral)
}
#msg.rules h1 {
  font-size:clamp(28px,6vh,76px);
  line-height:1.05
}
.guideGoal {
  font-size:clamp(18px,3vh,38px);
  color:#fff;
  font-weight:400;
  max-width:90vw
}
.guideSteps {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:1vw;
  width:92vw;
  text-align:left
}
.guideStep {
  border:.4vh solid var(--d);
  background:#111;
  padding:1.2vh 1vw;
  font-size:clamp(15px,2.3vh,30px);
  line-height:1.25;
  min-height:12vh
}
.guideStep b {
  color:var(--ice);
  display:block;
  font-size:2vh;
  margin-bottom:.6vh
}
.guideFacts {
  display:flex;
  gap:1vw;
  width:92vw
}
.guideFact {
  flex:1;
  min-width:0;
  border:.4vh solid var(--g);
  padding:.7vh 1vw;
  font-size:clamp(15px,2.4vh,31px);
  line-height:1.2
}
.guideFact:nth-child(2) {
  border-color:var(--teal)
}
.guideFact b {
  color:var(--g);
  display:block;
  font-size:1.8vh;
  letter-spacing:.12em;
  margin-bottom:.3vh
}
.gameScene {
  height:19vh;
  min-height:135px;
  width:92vw;
  display:flex;
  align-items:center;
  justify-content:center
}
.gameScene svg {
  width:min(82vw,900px);
  height:100%;
  overflow:visible;
  shape-rendering:crispEdges
}
.gameScene text {
  font-family:"Courier New",monospace;
  font-weight:700;
  letter-spacing:.04em
}
.gameScene .scene-note {
  font-size:15px;
  fill:var(--muted)
}
.gameScene .scene-caption {
  font-size:16px;
  fill:var(--ice)
}
.gameScene .scene-finish {
  font-size:18px;
  fill:var(--teal)
}
.gameScene .person-line {
  fill:none;
  stroke:var(--t);
  stroke-width:6;
  stroke-linecap:square;
  stroke-linejoin:miter
}
.scene-1 .blower-tip {
  transform-origin:155px 76px;
  animation:blower-pop 2s steps(4) infinite
}
.scene-1 .cotton {
  animation:cotton-off 2s ease-in infinite
}
.scene-1 .contact {
  animation:contact-flash 2s steps(1) infinite
}
@keyframes blower-pop {
  0%,12%,90%,100% {
    transform:scaleX(.3)
  }
  35%,58% {
    transform:scaleX(1)
  }
}
@keyframes cotton-off {
  0%,40% {
    transform:none;
    opacity:1
  }
  68%,88% {
    transform:translate(54px,57px);
    opacity:0
  }
  89%,100% {
    transform:none;
    opacity:1
  }
}
@keyframes contact-flash {
  0%,36%,65%,100% {
    opacity:0
  }
  38%,56% {
    opacity:1
  }
}
.scene-2 .fan-head {
  transform-origin:116px 112px;
  animation:head-fan 5.5s ease-in-out infinite
}
.scene-2 .fan-air {
  animation:plate-air 5.5s ease-in-out infinite
}
.scene-2 .candle-flame {
  transform-origin:460px 74px;
  animation:fan-flame 5.5s steps(3) infinite
}
@keyframes head-fan {
  0%,10%,30%,50%,100% {
    transform:rotate(-7deg)
  }
  20%,40%,60% {
    transform:rotate(7deg)
  }
  72%,92% {
    transform:none
  }
}
@keyframes plate-air {
  0%,12%,70%,100% {
    opacity:0;
    transform:translateX(-15px)
  }
  20%,40%,60% {
    opacity:1;
    transform:translateX(20px)
  }
}
@keyframes fan-flame {
  0%,16%,34% {
    opacity:1;
    transform:none
  }
  24%,42% {
    transform:scaleX(.6) rotate(15deg)
  }
  56%,91% {
    opacity:0;
    transform:translateY(-8px)
  }
  100% {
    opacity:1
  }
}
.scene-3 .lower-ribbon {
  animation:three-drops 6.8s ease-in-out infinite
}
.scene-3 .ribbon-arm-left {
  transform-origin:107px 66px;
  animation:ribbon-arm-left 6.8s ease-in-out infinite
}
.scene-3 .ribbon-arm-right {
  transform-origin:533px 66px;
  animation:ribbon-arm-right 6.8s ease-in-out infinite
}
@keyframes ribbon-arm-left {
  0%,9%,34%,58%,100% {
    transform:none
  }
  20%,26%,44%,50%,68%,88% {
    transform:rotate(46deg)
  }
}
@keyframes ribbon-arm-right {
  0%,9%,34%,58%,100% {
    transform:none
  }
  20%,26%,44%,50%,68%,88% {
    transform:rotate(-46deg)
  }
}
.scene-3 .drop-count {
  opacity:0;
  font-size:25px;
  fill:var(--teal)
}
.scene-3 .count-one {
  animation:drop-one 6.8s steps(1) infinite
}
.scene-3 .count-two {
  animation:drop-two 6.8s steps(1) infinite
}
.scene-3 .count-three {
  animation:drop-three 6.8s steps(1) infinite
}
