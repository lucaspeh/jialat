const ROLE=(location.hash.match(/host|tv/)||[''])[0];
const save=()=>{try{localStorage.setItem('jialat26',JSON.stringify(S))}catch(e){}};
const status=(kind,label)=>{$('dot').className='dot '+kind;$('sync').textContent=label};
let pt,retryTimer=null,sending=false,queued=null,stream=null,pollTimer=null,streamOpen=false,polling=false;
const pendingKey='jialat26-pending';
function pending(body){try{if(body)localStorage.setItem(pendingKey,body);else localStorage.removeItem(pendingKey)}catch(e){}}
function push(){queued=JSON.stringify(S);pending(queued);status('','Sending…');clearTimeout(pt);pt=setTimeout(sendLatest,250)}
async function sendLatest(){
 if(sending||!queued)return;
 sending=true;const body=queued;queued=null;
 const ctrl=new AbortController(),limit=setTimeout(()=>ctrl.abort(),8000);
 try{const r=await fetch(URL_,{method:'POST',body,signal:ctrl.signal});if(!r.ok){const e=Error('HTTP '+r.status);e.status=r.status;e.retryAfter=Number(r.headers.get('Retry-After'))||0;throw e}
  clearTimeout(retryTimer);retryTimer=null;
  if(!queued){pending(null);status('ok','Update sent')}
 }catch(e){if(!queued)queued=body;pending(queued);
  const detail=e.status===429?'Relay limit (429)':e.status?'Relay HTTP '+e.status:'Network request failed';
  status('bad',detail+' · retrying');
  clearTimeout(retryTimer);retryTimer=setTimeout(sendLatest,e.status===429?Math.max(5000,Math.min(1800000,e.retryAfter*1000||30000)):5000);
 }finally{clearTimeout(limit);sending=false;if(queued&&!retryTimer){clearTimeout(pt);pt=setTimeout(sendLatest,250)}}
}
function commit(){S.v=Math.max(Date.now(),S.v+1);save();render();push()}
function receive(j){try{if(j.event!=='message')return;const x=JSON.parse(j.message);
 if(x&&typeof x.v==='number'&&x.v>S.v){S=Object.assign(D(),x);save();render()}
}catch(e){}}
async function poll(){if(polling||document.hidden)return;polling=true;
 try{const ctrl=new AbortController(),limit=setTimeout(()=>ctrl.abort(),8000);let r;
  try{r=await fetch(URL_+'/json?poll=1&since=latest',{cache:'no-store',signal:ctrl.signal})}finally{clearTimeout(limit)}
  if(!r.ok)throw Error('HTTP '+r.status);
  (await r.text()).trim().split('\n').forEach(line=>{if(line)try{receive(JSON.parse(line))}catch(e){}});
  if(!streamOpen)status('ok','Connected · checking for updates');
 }catch(e){if(!streamOpen)status('bad','Connection unavailable · retrying')}
 finally{polling=false}}
function conn(){if(ROLE==='host'){status('','Ready to sync');if(!navigator.onLine)status('bad','Offline · retrying');return}
 status('','Connecting…');
 try{stream=new EventSource(URL_+'/sse?since=latest');
  stream.onopen=()=>{streamOpen=true;status('ok','Live');clearInterval(pollTimer);pollTimer=null};
  stream.onerror=()=>{streamOpen=false;status('bad','Reconnecting · checking for updates');if(!pollTimer)pollTimer=setInterval(poll,30000);poll()};
  stream.onmessage=ev=>{try{receive(JSON.parse(ev.data))}catch(e){}};
 }catch(e){status('bad','Connection unavailable · retrying');if(!pollTimer)pollTimer=setInterval(poll,30000)}
 poll();
}

   o.connect(g);g.connect(a.destination);voices.add(v);o.onended=()=>{voices.delete(v);o.disconnect();g.disconnect()};o.start(t);o.stop(t+d+.02)

c+=`<div class="rw" style="margin-top:10px"><button onclick="clr(${g})">Clear game</button></div><div class="sm" style="margin-top:8px">POINTS GIVEN ${sum} / ${EXP[x.t]} ${sum==EXP[x.t]?'✓':''}</div></div>`;
h+=c;
const st=stand(9),ties=allDone()?st.filter((o,k)=>(k>0&&st[k-1].t==o.t&&st[k-1].b==o.b)).map(o=>o.r-1):[];
h+=`<div class="lb">STANDINGS</div><div style="line-height:1.8">${st.map(o=>`${o.r}. ${nm(o.i)} <b style="color:var(--l)">${o.t}</b>`).join(' · ')}</div>`;
if(ties.length)h+=`<div class="msg">TIE FOR PLACE ${ties.join(', ')}: replay Snow Blower, then give the winner a +1 tie-break below.</div>`;
h+=`<div class="rw" style="margin-top:10px"><button id="copyResults" onclick="copyRes()">Copy results</button></div>
<details><summary>NAMES &amp; TIE-BREAK</summary>${S.nm.map((n,i)=>`<div class="nr"><input value="${esc(n)}" maxlength="14" onchange="nn(${i},this.value)"><button onclick="tbb(${i},-1)">−</button><span>${S.tb[i]||0}</span><button onclick="tbb(${i},1)">+</button></div>`).join('')}</details><div class="hint" style="margin-top:20px">Play all nine games again with the same people. Clears every result and tie-break.</div><div class="rw"><button onclick="reset()">Start a new round</button></div>`;
$('H').innerHTML=h}
// ---- tv ----
const rows=[];
function mkRows(){for(let i=0;i<10;i++){const d=document.createElement('div');d.className='row';d.innerHTML='<div class="in"><b class="rk"></b><div class="bar"><i></i><span class="nm"></span></div><b class="pt"></b></div>';$('rows').appendChild(d);rows.push(d)}}
function confetti(){for(let k=0;k<80;k++){const s=document.createElement('span');s.className='cf';s.style.cssText=`left:${Math.random()*100}vw;background:${['#f3d77a','#d4af37','#fff','#65d9cb','#ff8b78'][k%5]};animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*1.5}s`;document.body.appendChild(s);setTimeout(()=>s.remove(),7000)}}
let lastRev=-1;
function activeCountdown(){return validCountdown(S.timer)&&S.m[0]==='rules'&&S.m[1]===S.timer.g?S.timer:null}
function drawTvCountdown(c){
 const x=G[c.g];$('msg').className='timer-view';
 $('msg').innerHTML=`<div class="sm">GAME ${String(c.g+1).padStart(2,'0')} / 09 · ${LIMIT[c.g]} SECONDS</div><h1>${esc(x.n)}</h1><div class="timer-team">TEAM ${'AB'[c.slot]}</div><div class="timer-names">${x.u[c.slot].map(p=>nm(p-1)).join(' · ')}</div><div id="tvClockPhase" role="status" aria-live="polite"></div><div id="tvClock" aria-label="Time remaining"></div><div class="tv-clock-track" role="progressbar" aria-label="Round time remaining" aria-valuemin="0" aria-valuemax="${LIMIT[c.g]}"><div id="tvClockBar"></div></div><div id="tvClockHint"></div>`;
 tickTvCountdown()
}
function tickTvCountdown(){
 const c=activeCountdown(),clock=$('tvClock');if(!c||!clock)return;const f=countdownFrame(c),phase=$('tvClockPhase'),hint=$('tvClockHint'),bar=$('tvClockBar');
 clock.textContent=f.phase==='ready'?String(f.ready):Math.floor(f.seconds/60)+':'+String(f.seconds%60).padStart(2,'0');
 clock.setAttribute('aria-label',f.phase==='ready'?'Starting in '+f.ready+' seconds':f.seconds+' seconds remaining');
 const title=f.phase==='ready'?'GET READY':f.phase==='ended'?'TIME! STOP':Date.now()-c.startAt<1000?'GO!':'TIME REMAINING';if(phase.textContent!==title)phase.textContent=title;
 hint.textContent=f.phase==='ready'?'Wait for GO.':f.phase==='ended'?(c.g===7?'Count only ornaments inside the basket.':'Hands away. Count only cups still balanced without help.'):(c.g===7?'Knees only. Drop, return and tag the next teammate.':'Keep stacking. Hands away when time is up.');
 bar.style.width=(f.fraction*100)+'%';bar.parentElement.setAttribute('aria-valuenow',String(f.seconds));
 $('msg').classList.toggle('urgent',f.phase==='ended'||f.phase==='running'&&f.seconds<=10);$('msg').classList.toggle('ended',f.phase==='ended')
}
function tv(){const m=S.m,rank=m[0]=='rev'&&m[1]>0?REVEAL_ORDER[m[1]-1]:null,spot=m[0]=='rev'&&S.spotlight&&(rank===1||rank===10),sealed=m[0]=='board'&&m[1]>=9&&allDone()&&!S.finalShown,b=!sealed&&!spot&&(m[0]=='board'||m[0]=='rev');$('bd').style.display=b?'flex':'none';$('msg').style.display=b?'none':'flex';
$('msg').className=spot?'spotlight '+(rank===10?'trophy':'champion'):m[0]=='rules'?'rules':'';
if(!b){lastRev=-1;if(spot){const st=stand(9),who=st[rank-1];$('msg').innerHTML=`<div class="spot-icon">${spr(rank===10?'trophy':'medal',14)}</div><div class="spot-rank">${rank===10?'10TH PLACE · THE JIALAT TROPHY':'1ST PLACE · CHAMPION'}</div><h1>${rank===10?'THE JIALAT TROPHY':'THE CHAMPION'}</h1><div class="spot-name">${nm(who.i)}</div>`}
else if(sealed){$('msg').innerHTML=`<div class="bob">${spr('screen',8)}</div><h1>ALL NINE GAMES COMPLETE</h1><div class="tag">THE FINAL REVEAL IS COMING</div>`}
else if(activeCountdown()){drawTvCountdown(S.timer)}
else if(m[0]=='rules'){const x=G[m[1]],a=GUIDE[m[1]],kind={s:'SOLO',p:'PAIRS',t:'TEAMS OF FIVE'}[x.t];
$('msg').innerHTML=`<div class="sm">GAME ${String(m[1]+1).padStart(2,'0')} / 09</div><h1>${esc(x.n)}</h1><div class="tag">${kind}</div><div class="guideGoal">${esc(a.goal)}</div>${scene(m[1])}
<div class="guideSteps">${a.steps.map((s,i)=>`<div class="guideStep"><b>STEP ${i+1}</b>${esc(s)}</div>`).join('')}</div>
<div class="guideFacts"><div class="guideFact"><b>PLAY</b>${esc(a.turn)}</div><div class="guideFact"><b>WIN BY</b>${esc(a.win)}</div><div class="guideFact"><b>POINTS</b>${esc(a.points)}</div></div>
${x.u?`<div class="sm">${x.t=='p'?'PAIR LINEUP':'TEAMS'}</div><div class="gr">${x.u.map((u,k)=>`<div class="gb">${x.t=='t'?'TEAM '+'AB'[k]+'<br>':''}${u.map(p=>nm(p-1)).join(x.t=='t'?' · ':' &amp; ')}</div>`).join('')}</div>`:''}`}
else $('msg').innerHTML=`${festiveIcons('<div class="bob">'+spr('screen',8)+'</div>')}<h1>JIALAT CHRISTMAS 2026</h1><div class="tag">18 YEARS · 10 FRIENDS · 9 GAMES</div>`;return}
const rev=m[0]=='rev',k=rev?m[1]:10,n=rev?9:m[1],fin=rev||(n>=9&&allDone()&&S.finalShown),st=stand(n),top=Math.max(1,st[0].t);
$('th').textContent=rev?'THE FINAL VERDICT':n>=9?(fin?'FINAL STANDINGS':'LIVE STANDINGS'):'AFTER GAME '+n;
$('ban').textContent=!rev||!k?'':rank===10?'THE JIALAT TROPHY GOES TO '+rn(st[9].i).toUpperCase():rank===1?'CHAMPION: '+rn(st[0].i).toUpperCase():rank>=7?'NEXT YEAR’S ORGANISER: '+rn(st[rank-1].i).toUpperCase():'#'+rank+' SAFE: '+rn(st[rank-1].i).toUpperCase();
st.forEach(o=>{const d=rows[o.i],hide=rev&&!REVEAL_ORDER.slice(0,k).includes(o.r),z=o.r==10?3:o.r>=7?2:o.r==1?0:1,old=d.dataset.r;
d.style.transform=`translateY(${(o.r-1)*100}%)`;d.className='row z'+z+(hide?' hid':'');
if(old&&old!=o.r&&!hide){d.classList.add('hop')}d.dataset.r=o.r;
d.querySelector('.rk').textContent=o.r;d.querySelector('.nm').innerHTML=hide?'???':esc(rn(o.i))+(fin&&o.r==10?`<span class="wob">${spr('medal',3)}</span>`:fin&&o.r>=7&&o.r<10?'<small>ORGANISER</small>':'');
d.querySelector('i').style.width=hide?'0':(o.t/top*100)+'%';d.querySelector('.pt').textContent=hide?'':o.t});
if(rev&&k==10&&lastRev!=10)confetti();lastRev=rev?k:-1}
// ---- boot ----
function render(){document.body.className=ROLE||'landing';if(ROLE=='host')host();else if(ROLE=='tv'){tv();tvRevealAudio()}else $('H').innerHTML=`<div class="chooser"><div class="title-icons">${holidayIcon('tree')}<div class="title-middle"><svg class="pixel-abacus" viewBox="0 0 18 14" aria-label="Animated pixel abacus" role="img">
<path fill="#d4af37" d="M1 1h16v1H1zM1 2h1v10H1zM16 2h1v10h-1zM1 12h16v1H1z"/>
<path fill="#6b5a22" d="M3 4h12v1H3zM3 7h12v1H3zM3 10h12v1H3z"/>
<g class="bead-one"><path fill="#65d9cb" d="M4 3h2v3H4z"/></g>
<g class="bead-two"><path fill="#86baff" d="M5 6h2v3H5z"/></g>
<g class="bead-three"><path fill="#ff8b78" d="M7 9h2v3H7z"/></g>
</svg></div>${holidayIcon('santa')}</div><h1>SCOREBOARD</h1><div class="rw"><button class="go" onclick="location.hash='host';location.reload()">iPad · Host</button><button class="go" onclick="location.hash='tv';location.reload()">MacBook · TV</button></div></div>`}
restoreCountdown();
if(ROLE=='tv'){mkRows();setInterval(tickTvCountdown,100);$('T').ondblclick=()=>document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
render();if(ROLE)conn();
if(ROLE==='host')try{queued=localStorage.getItem(pendingKey);if(queued){status('','Sending saved update…');sendLatest()}}catch(e){}
</script></body></html>
