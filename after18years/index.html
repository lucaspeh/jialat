  $('order-list').innerHTML=Array.from({length:11},(_,i)=>'<li class="'+(order[i]===undefined?'waiting':i===10&&complete?'last':d&&i===d.position-1?'latest':'')+'">'+(order[i]===undefined?'—':esc(NAMES[order[i]]))+'</li>').join('');
  if(mode==='host'){
   $('spin').disabled=!peer||busy||active||complete||blocked;
   $('spin').textContent=blocked?'Host open on another device':pending?'Sending draw…':probe?'Checking TV…':active?'Spinning…':complete?'Draw complete':!peer?'Connect TV to spin':'Spin for '+ordinal(order.length+1)+' presenter';
   $('host-hint').textContent=blocked?'Use the original host link, or create a new draw.':pending?'This draw is saved. Sync will retry without picking another name.':probe?'Checking that the TV is on screen before drawing.':active?'The result is shared with the TV.':complete?'All 11 names are in the list.':peer?'Each picked name leaves the wheel before the next spin.':'Open the TV display using the code above.';
   $('restart').disabled=busy||active||!S||S.order.length===0||blocked;
  }
 }
 if(discWinner()!==String(d&&!active?d.winner:'')){
  document.querySelectorAll('#wheel-disc g').forEach(g=>{const path=g.querySelector('path'),hit=!!(d&&!active&&Number(g.dataset.person)===d.winner);path.setAttribute('stroke',hit?'#fff4be':'#0a0a0a');path.setAttribute('stroke-width',hit?12:5)});
  $('wheel-disc').dataset.winner=d&&!active?String(d.winner):'';
 }
 status();if(d&&ready&&progress<1)raf=requestAnimationFrame(paint);
}
function discWinner(){return $('wheel-disc').dataset.winner||''}
function status(){
 if(!$('sync'))return;const e=$('sync');let text='',kind='';
 if(blocked){text='Another host controls this draw';kind='error'}
 else if(pending){text=errorText?'Saved · '+errorText+' · retrying':'Sending the saved draw…';kind=errorText?'error':''}
 else if(probe)text='Checking the TV connection…';
 else if(errorText){text=errorText;kind='error'}
 else if(mode==='host'){text=peer?'TV paired · checked before each spin':'Waiting for the TV display';kind=peer?'ok':''}
 else{ text=!calibrated()?'Connecting to the host…':streamOpen?'Live updates connected':pollOK?'Connected · checking for updates':'Reconnecting · saved order kept';kind=calibrated()&&(streamOpen||pollOK)?'ok':''}
 e.textContent=text;e.className='sync'+(kind?' '+kind:'');if(!storageOK)$('storage-warning').hidden=false;
}
async function publish(message){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
 try{const response=await fetch(BASE+PREFIX+room,{method:'POST',body:JSON.stringify(message),signal:controller.signal});if(!response.ok){const e=Error('HTTP '+response.status);e.status=response.status;e.retryAfter=Number(response.headers.get('Retry-After'))||0;throw e}return response}
 finally{clearTimeout(timer)}
}
function control(type,data){return publish(Object.assign({t:type,room,nonce:uid(),at:Date.now()},data)).catch(e=>{if(type==='hello'||type==='host-online')return;throw e})}
function stage(packet){if(pending)return;pending=packet;errorText='';save();paint();flush()}
function accepted(packet){
 if(!pending||packet.id!==pending.id)return;S=packet;pending=null;errorText='';clearTimeout(retryTimer);retryTimer=0;retryAt=0;save();paint();
 if(waitingDisplay){const target=waitingDisplay;waitingDisplay='';beginProbe('sync',target)}
}
async function flush(){
 if(mode!=='host'||sending||!pending||blocked)return;sending=true;const packet=pending;
 try{await publish({t:'state',room,state:packet});accepted(packet)}
 catch(e){if(pending&&pending.id===packet.id){const delay=e.status===429?Math.max(5000,Math.min(1800000,e.retryAfter*1000||30000)):5000;errorText=e.status===429?'relay busy (429)':e.status?'relay HTTP '+e.status:'connection unavailable';retryAt=Date.now()+delay;clearTimeout(retryTimer);retryTimer=setTimeout(flush,delay);paint()}}
 finally{sending=false;if(pending&&pending.id!==packet.id&&!retryTimer)flush()}
}
function cancelProbe(message){if(!probe)return;clearTimeout(probe.timer);probe=null;if(message)errorText=message;paint()}
function beginProbe(purpose,target){
 if(mode!=='host'||pending||blocked)return;if(probe){if(purpose==='sync')waitingDisplay=target;return}
 const p={id:uid(),purpose,target:target||'*',sentAt:Date.now(),timer:0};probe=p;errorText='';fastUntil=Date.now()+22000;paint();
 p.timer=setTimeout(()=>{if(probe===p)cancelProbe('TV not responding. Open or refresh the TV display, then try again.')},20000);
 control('probe',{probe:p.id,target:p.target,hostAt:p.sentAt}).then(()=>{if(!streamOpen)poll()}).catch(e=>{if(probe===p)cancelProbe(e.status===429?'Relay busy (429). Wait a moment, then try again.':'Could not reach the TV. Check the connection and try again.')});schedulePoll();
}
function startSpin(){if(mode!=='host'||!peer||pending||probe||spinning()||S.order.length===11||blocked)return;beginProbe('spin',peer.id)}
function makeDraw(){
 const players=NAMES.map((_,i)=>i).filter(i=>!S.order.includes(i)),index=randomIndex(players.length),winner=players[index],position=S.order.length+1;
 const norm=((-(index+.5)*360/players.length)%360+360)%360,startAt=Date.now()+700,order=S.order.concat(winner);
 if(players.length===2)order.push(players.find(i=>i!==winner));
 const clocks=Object.assign({},S.clocks,{[peer.id]:peer.offset});
 return snapshot({order,clocks,draw:{id:uid(),position,players,winner,startAt,endAt:startAt+6500,to:360*(5+randomIndex(3))+norm}});
}
function restart(){if(mode!=='host'||pending||probe||spinning()||blocked||!S.order.length)return;if(!confirm('Restart the presentation draw? This clears all 11 positions on the host and TV.'))return;stage(snapshot({order:[],draw:null}))}
function onMessage(envelope){
 if(!envelope||envelope.event!=='message')return;if(envelope.id)cursor=envelope.id;
 if(envelope.id&&seen.has(envelope.id))return;if(envelope.id){seen.add(envelope.id);if(seen.size>400)seen.delete(seen.values().next().value)}
 let m;try{m=JSON.parse(envelope.message)}catch(e){return}if(!m||m.room!==room)return;
 if(m.t==='state'){
  const x=m.state;if(!valid(x))return;
  if(mode==='host'&&x.owner!==owner){if(!S||x.rev>=S.rev){blocked=true;errorText='Another host controls this draw';paint()}return}
  if(mode==='host'&&pending&&pending.id===x.id){accepted(x);return}
  if(mode==='host'&&pending&&x.rev>=pending.rev&&x.id!==pending.id){pending=null;clearTimeout(retryTimer);retryTimer=0;S=x;save();paint();return}
  if(!S||x.rev>S.rev){S=x;save();paint()}
  if(mode==='tv'&&S&&x.id===S.id)control('ack',{display:displayId,stateId:x.id}).catch(()=>{});
  return;
 }
 if(mode==='tv'){
  if(m.t==='host-online'){announce();return}
  if(m.t==='probe'&&(m.target==='*'||m.target===displayId)&&typeof m.probe==='string'&&finite(m.hostAt)){
   fastUntil=Date.now()+16000;schedulePoll();control('ready',{display:displayId,probe:m.probe,hostAt:m.hostAt,tvAt:Date.now(),visible:!document.hidden,rev:S?S.rev:0}).catch(()=>{});
  }
  return;
 }
 if(m.t==='hello'&&(/^[a-f0-9]{16}$/).test(m.display)&&Math.abs(Date.now()-(envelope.time*1000||m.at))<25000){
  if(probe&&probe.target===m.display||peer&&peer.id===m.display&&Date.now()-peer.seen<10000)return;
  if(pending||probe)waitingDisplay=m.display;else beginProbe('sync',m.display);return;
 }
 if(m.t==='ready'&&probe&&m.probe===probe.id&&(probe.target==='*'||probe.target===m.display)&&(/^[a-f0-9]{16}$/).test(m.display)&&finite(m.tvAt)){
  const p=probe;clearTimeout(p.timer);probe=null;
  if(!m.visible){errorText='The TV tab is in the background. Bring it on screen before spinning.';paint();return}
  if(m.rev>S.rev){errorText='The TV has a newer draw. Reconnect the host before spinning.';poll();paint();return}
  const roundTrip=Date.now()-p.sentAt,offset=roundTrip<3000?(p.sentAt+Date.now())/2-m.tvAt:0;
  peer={id:m.display,offset,seen:Date.now()};errorText='';if($('pairing'))$('pairing').open=false;
  if(p.purpose==='spin'){stage(makeDraw())}
  else{const clocks=Object.assign({},S.clocks,{[peer.id]:peer.offset});while(Object.keys(clocks).length>8)delete clocks[Object.keys(clocks)[0]];stage(snapshot({clocks}))}
  return;
 }
 if(m.t==='ack'&&typeof m.display==='string'&&S&&m.stateId===S.id){if(peer&&peer.id===m.display)peer.seen=Date.now();status()}
}
function announce(){if(mode==='tv'&&!document.hidden)control('hello',{display:displayId}).catch(()=>{})}
function schedulePoll(){clearTimeout(pollTimer);pollTimer=0;if(!mode||streamOpen)return;pollTimer=setTimeout(async()=>{await poll();schedulePoll()},Date.now()<fastUntil?1000:12000)}
async function poll(){
 if(polling||!mode||document.hidden)return;polling=true;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
 try{const r=await fetch(BASE+PREFIX+room+'/json?poll=1&since='+encodeURIComponent(cursor||'all'),{cache:'no-store',signal:controller.signal});if(!r.ok){if((r.status===400||r.status===404)&&cursor)cursor='';throw Error('Poll failed')}(await r.text()).trim().split('\n').forEach(line=>{if(line)try{onMessage(JSON.parse(line))}catch(e){}});pollOK=true}
 catch(e){pollOK=false}finally{clearTimeout(timer);polling=false;status()}
}
function connect(){
 if(stream)stream.close();streamOpen=false;
 try{stream=new EventSource(BASE+PREFIX+room+'/sse?since='+encodeURIComponent(cursor||'all'));
  stream.onopen=()=>{streamOpen=true;pollOK=true;clearTimeout(pollTimer);pollTimer=0;status();if(mode==='host'){flush();control('host-online',{}).catch(()=>{})}else{announce();clearTimeout(helloTimer);helloTimer=setTimeout(announce,2000)}};
  stream.onerror=()=>{streamOpen=false;status();poll();schedulePoll()};
  stream.addEventListener('message',e=>{try{onMessage(JSON.parse(e.data))}catch(err){}});
 }catch(e){streamOpen=false;poll();schedulePoll()}
}
function resume(){if(!mode||document.hidden)return;errorText='';connect();poll();if(mode==='host')flush();else announce();paint()}
async function copyTV(){try{if(!navigator.clipboard||!navigator.clipboard.writeText)throw Error('Clipboard unavailable');await navigator.clipboard.writeText(tvLink());$('copy-note').textContent='TV link copied. Open it on the MacBook or TV.'}catch(e){$('tv-link').focus();$('tv-link').select();$('copy-note').textContent='Select and copy the TV link above.'}}
function cleanup(){if(stream)stream.close();stream=null;clearTimeout(pollTimer);clearTimeout(retryTimer);clearTimeout(helloTimer);if(probe)clearTimeout(probe.timer);if(raf)cancelAnimationFrame(raf);raf=0;probe=null;peer=null;waitingDisplay='';seen=new Set();cursor='';streamOpen=false;pollOK=false;wheelKey='';viewKey='';sending=false;polling=false;blocked=false;errorText=''}
function route(){
 cleanup();mode='';room='';owner='';S=null;pending=null;
 const m=/^#(host|tv)=([a-z2-9]{8})(?:\.([a-f0-9]{16}))?$/.exec(location.hash);
 if(!m||m[1]==='host'&&!m[3]){landing();return}
 mode=m[1];room=m[2];owner=m[3]||'';displayId=uid();const saved=read('state-'+room);if(valid(saved))S=saved;
 if(mode==='host'){
  write('last',{room,owner});const h=read('host-'+room);if(h&&h.owner===owner&&valid(h.pending))pending=h.pending;
  if(!S)S=emptyState();if(S.owner!==owner)blocked=true;
  if(!pending&&!blocked)pending=S;save();
 }
 layout();connect();poll();if(mode==='host')flush();else{announce();helloTimer=setTimeout(announce,2000)}
}
window.addEventListener('hashchange',route);window.addEventListener('online',resume);window.addEventListener('pageshow',e=>{if(e.persisted)resume()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resume()});
route();
})();
</script></body></html>
