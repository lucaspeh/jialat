name: Verify live JIALAT after the server switch
on:
  push:
    branches: [diagnostics/safari-relay-ab]
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start Safari WebDriver
        run: |
          sudo safaridriver --enable
          safaridriver -p 4444 >"$RUNNER_TEMP/safaridriver.log" 2>&1 &
          for i in {1..20}; do
            if curl --silent --fail http://localhost:4444/status >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify pairing and update delivery on the deployed site
        run: |
          RELAY_DEPLOYED_ONLY=1 python3 -u - <<'PY'
          import json, secrets, sys
          sys.path.insert(0,'diagnostics')
          import safari_relay as q

          original_wd = q.wd
          def webdriver(url, data=None, method=None):
              if url.endswith(':9515/session') and data:
                  data['capabilities']['alwaysMatch']['pageLoadStrategy'] = 'none'
              return original_wd(url, data, method)
          q.wd = webdriver

          def visit(tab, url):
              path, marker, fragment = url.partition('#')
              url = path + '?v=26-live-3&check=' + secrets.token_hex(4) + marker + fragment
              tab.goto(url)
              condition = 'location.href===' + json.dumps(url)
              condition += " && window.JialatUI?.build==='26' && [...document.scripts].some(s=>s.getAttribute('src')?.endsWith('reliability.js?v=26-live-3'))"
              q.until(tab, condition, 'deployed repaired game boot', 20)
          q.visit = visit

          from pathlib import Path
          from urllib.request import Request, urlopen
          deployed = '5f88763c68aedd6faacbb1cf511c8df92b01eadc'
          import subprocess, time
          for path in ('index.html', 'roomwars/index.html', 'scoreboard/index.html', 'after18years/index.html', 'assets/reliability.js'):
              expected = subprocess.check_output(['git','show',deployed+':'+path])
              for attempt in range(12):
                  try:
                      req = Request(q.PAGES+'/'+path+'?v=26-live-3',headers={'Cache-Control':'no-cache'})
                      with urlopen(req, timeout=10) as res:
                          if res.read() == expected:
                              print('Live file matched',path,flush=True)
                              break
                  except OSError:
                      pass
                  time.sleep(5)
              else:
                  raise RuntimeError('Latest file missing from Pages: '+path)
          source = Path(q.__file__).read_text().replace('ntfy.sh','ntfy.adminforge.de')
          ns = {'__name__':'diagnostic'}
          exec(compile(source[:source.index('class QuietHandler')], q.__file__, 'exec'), ns)
          q.scoreboard = ns['scoreboard']
          source = source.replace('if tag=="candidate-quiet":\n                continue','if tag in ("candidate-quiet", "published"):\n                continue')
          q.main = None
          exec(compile(source[source.index('def main():'):source.index('if __name__==')], q.__file__, 'exec'), q.__dict__)
          q.main()
          PY
