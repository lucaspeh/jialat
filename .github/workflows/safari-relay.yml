name: Safari relay diagnosis
on:
  push:
    branches: [diagnostics/safari-relay-ab]
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start Safari WebDriver
        run: |
          sudo safaridriver --enable
          safaridriver -p 4444 >"$RUNNER_TEMP/safaridriver.log" 2>&1 &
          for i in {1..20}; do
            if curl --silent --fail http://localhost:4444/status >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify deployed assets and three live connections
        run: |
          python3 -u - <<'PY'
          import concurrent.futures, subprocess, time, urllib.request
          commit = '6cbcab474555726340dca300029f4523a4a2d747'
          site = 'https://lucaspeh.github.io/jialat/'
          assets = ['roomwars/index.html', 'scoreboard/index.html', 'after18years/index.html', 'assets/reliability.js']
          def check(path):
              url = site + path + '?v=26-live-2.1'
              want = subprocess.check_output(['git','show',f'{commit}:{path}'])
              for _ in range(12):
                  try:
                      req = urllib.request.Request(url, headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=10) as res:
                          if res.read() == want:
                              print('Verified published bytes', path, flush=True)
                              return
                  except OSError:
                      pass
                  time.sleep(5)
              raise RuntimeError(f'Published bytes differ for {path}')
          with concurrent.futures.ThreadPoolExecutor() as threads:
              list(threads.map(check, assets))
          PY
          RELAY_DEPLOYED_ONLY=1 python3 -u diagnostics/safari_relay.py
