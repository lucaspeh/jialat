name: Safari relay diagnosis
on:
  push:
    branches: [diagnostics/safari-relay-ab]
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start Safari WebDriver
        run: |
          sudo safaridriver --enable
          safaridriver -p 4444 >"$RUNNER_TEMP/safaridriver.log" 2>&1 &
          for i in {1..20}; do
            if curl --silent --fail http://localhost:4444/status >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Compare the exact revisions in Intel Mac Safari
        run: |
          python3 -u - <<'PY'
          import contextlib, functools, http.server, pathlib, subprocess, sys, tarfile, tempfile, threading, time
          sys.path.insert(0, 'diagnostics')
          import safari_relay as q
          from urllib.request import urlopen
          from hashlib import sha256
          baseline='ce316eed992eab1a70c73796d57fb155e691f298'
          repaired='6cbcab474555726340dca300029f4523a4a2d747'
          for path in ['assets/reliability.js','roomwars/index.html','scoreboard/index.html','after18years/index.html']:
              body=urlopen(q.PAGES+'/'+path,timeout=20).read()
              match=next((ref for ref in [baseline,repaired] if body==subprocess.check_output(['git','show',ref+':'+path])),None)
              assert match, path + ' on Pages differed from both revisions'
              print('Published asset',path,match[:7])
          driver=q.Driver('http://127.0.0.1:4444',{'browserName':'safari'})
          try:
              print('Native browser',driver.browser)
              for name,ref,expected in [('before',q.BEFORE,True),('rewrite',q.REWRITE,False),('repair',repaired,True)]:
                  with tempfile.TemporaryDirectory() as folder:
                      with subprocess.Popen(['git','archive',ref],stdout=subprocess.PIPE) as p,tarfile.open(fileobj=p.stdout,mode='r|') as archive:
                          archive.extractall(folder,filter='data')
                      with http.server.ThreadingHTTPServer(('127.0.0.1',0),functools.partial(q.QuietHandler,directory=folder)) as srv:
                          threading.Thread(target=srv.serve_forever,daemon=True).start()
                          base='http://127.0.0.1:'+str(srv.server_port)
                          normal=q.opening_probe(driver,base,False)
                          quiet=q.opening_probe(driver,base,True)
                          print('Safari A/B',name,'normal',normal['delivered'],'withheld',quiet['delivered'])
                          assert normal['delivered'] and quiet['delivered']==expected and quiet['metadata']>0
                          srv.shutdown()
          finally:
              driver.close()
          PY
      - name: Verify all three repaired connections with both browser roles
        run: python3 -u diagnostics/safari_relay.py
