name: Isolated alternate JIALAT relay trial
on:
  push:
    branches: [diagnostics/safari-relay-ab]
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start Safari WebDriver
        run: |
          sudo safaridriver --enable
          safaridriver -p 4444 >"$RUNNER_TEMP/safaridriver.log" 2>&1 &
          for i in {1..20}; do
            if curl --silent --fail http://localhost:4444/status >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test a separate copy with dummy game data
        run: |
          python3 -u - <<'PY'
          import json, os, pathlib, secrets, subprocess, sys, urllib.request
          domains = ['ntfy.adminforge.de', 'ntfy.envs.net', 'ntfy.jae.fi', 'ntfy.tedomum.fr']
          for domain in domains:
              root = 'https://' + domain
              topic = 'jialat-test-' + secrets.token_hex(16)
              message = 'isolated synthetic relay test'
              try:
                  with urllib.request.urlopen(root+'/v1/health', timeout=7) as response:
                      if not json.load(response).get('healthy'):
                          raise ValueError('health check failed')
                  request = urllib.request.Request(root+'/'+topic, data=message.encode(), method='POST')
                  with urllib.request.urlopen(request, timeout=7) as response:
                      if json.load(response)['message'] != message:
                          raise ValueError('publish acknowledgement differed')
                  request = urllib.request.Request(root+'/'+topic+'/json?poll=1&since=all', headers={'Origin':'https://lucaspeh.github.io'})
                  with urllib.request.urlopen(request, timeout=7) as response:
                      if response.headers.get('Access-Control-Allow-Origin') != '*':
                          raise ValueError('cross-origin access unavailable')
                      if not any(json.loads(line).get('message') == message for line in response):
                          raise ValueError('test update missing')
              except (OSError, KeyError, ValueError) as error:
                  print('Skipped',domain,type(error).__name__)
                  continue
              break
          else:
              raise SystemExit('No candidate supported the basic relay checks')
          print('Testing alternate relay',domain)
          source = pathlib.Path('diagnostics/safari_relay.py').read_text()
          source = source.replace('versions=[("candidate",candidate),("candidate-quiet",candidate)]','versions=[("alternate",candidate)]')
          handler = '                handler=functools.partial'
          assert handler in source
          replacement = [
              '                for game in ("roomwars", "scoreboard", "after18years"):',
              '                    page = folder / game / "index.html"',
              '                    text = page.read_text()',
              '                    assert "https://ORIGINAL/" in text',
              '                    page.write_text(text.replace("https://ORIGINAL/", "https://HOST/"))',
              handler,
          ]
          source = source.replace(handler, '\n'.join(replacement), 1)
          source = source.replace('ntfy.sh', domain).replace('https://ORIGINAL/','https://ntfy.sh/').replace('https://HOST/','https://'+domain+'/')
          source = source.replace('if tag=="candidate-quiet":\n                continue','if tag in ("candidate-quiet", "alternate"):\n                continue')
          os.environ['RELAY_CANDIDATE'] = 'bb06f02e2c99e6dcdbfb188287be61331e51d678'
          exec(compile(source,'alternate_relay_trial.py','exec'),{'__name__':'__main__'})
          PY
