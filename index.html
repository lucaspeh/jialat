<style>
:root{--bg:#0a0a0a;--g:#d4af37;--l:#f3d77a;--d:#6b5a22;--m:#a08a45;--t:#f2ead3}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font:700 15px/1.45 "Courier New",ui-monospace,monospace;letter-spacing:.04em;min-height:100vh;padding:calc(28px + env(safe-area-inset-top,0px)) 16px 28px;max-width:520px;margin:auto;text-align:center}

.bob{animation:bob 1s steps(2) infinite}@keyframes bob{50%{transform:translateY(-6px)}}
a.b{display:block;margin-top:14px;padding:16px 12px;border:3px solid var(--g);background:#2a2108;color:var(--l);text-decoration:none;text-transform:uppercase;box-shadow:5px 5px 0 #000,5px 5px 0 1px var(--d)}
a.b:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
a.b small{display:block;color:var(--m);font-weight:400;font-size:12px;margin-top:2px}
@media(prefers-reduced-motion:reduce){.bob{animation:none}}
.link-heading{display:flex;align-items:center;justify-content:center;gap:12px}.link-heading svg{flex:none}a.b.itinerary{border-color:#65d9cb;background:#10201d;color:#b4f8ed}a.b.itinerary small{color:#b9b6a8}.route-dots{animation:route-flow 4s linear infinite}.route-pin{animation:route-pin 4s steps(3) infinite}@keyframes route-flow{to{stroke-dashoffset:-20}}@keyframes route-pin{50%{transform:translateY(-1px)}}
a.b:focus-visible{outline:3px solid #86baff;outline-offset:5px}
@media(prefers-reduced-motion:reduce){.route-dots,.route-pin{animation:none}}
