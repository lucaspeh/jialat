a.b small{display:block;color:var(--m);font-weight:400;font-size:12px;margin-top:2px}
@media(prefers-reduced-motion:reduce){.bob{animation:none}}
.link-heading{display:flex;align-items:center;justify-content:center;gap:12px}.link-heading svg{flex:none}a.b small{color:#b9b6a8}.route-dots{animation:route-flow 4s linear infinite}.route-pin{animation:route-pin 4s steps(3) infinite}@keyframes route-flow{to{stroke-dashoffset:-20}}@keyframes route-pin{50%{transform:translateY(-1px)}}

@media(prefers-reduced-motion:reduce){.route-dots,.route-pin{animation:none}}

@media(prefers-reduced-motion:reduce){.door-panel,.door-key,.menu-bead-one,.menu-bead-two,.wheel-turn{animation:none!important}}
