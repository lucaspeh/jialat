<html lang="en">

  <style>
:root  {
  color-scheme: dark;
  --background: #0a0a0a;
  --card-background: #1c180e;
  --card-hover: #28210e;
  --gold: #d4af37;
  --gold-light: #f3d77a;
  --gold-deep: #6b5a22;
  --text: #f2ead3;
  --text-muted: #b9b6a8;
  --focus: #86baff;
}
*  {
  box-sizing: border-box;
}
html  {
  -webkit-text-size-adjust: 100%;
}
body  {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  background: var(--background);
  color: var(--text);
  font: 400 15px/1.5 "Courier New", ui-monospace, monospace;
  letter-spacing: .025em;
}
.menu-shell  {
  width: 100%;
  max-width: 980px;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  margin-inline: auto;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
}
.menu-header  {
  text-align: center;
  margin-bottom: 18px;
}
.christmas-mark  {
  display: block;
  width: 30px;
  height: 34px;
  margin: 0 auto 8px;
  animation: tree-bob 4.8s steps(3, end) infinite;
}
h1  {
  margin: 0;
  color: var(--gold-light);
  font-size: clamp(28px, 4.5vw, 38px);
  line-height: 1.2;
  letter-spacing: .065em;
  text-shadow: 2px 2px 0 var(--gold-deep);
}
.friendship  {
  margin: 6px 0 8px;
  color: var(--text-muted);
  font-size: 14px;
  letter-spacing: .035em;
}
.trip-dates  {
  display: inline-block;
  margin: 0;
  padding: 5px 11px;
  border: 1px solid var(--gold-deep);
  color: var(--gold-light);
  font-size: 12px;
  letter-spacing: .04em;
}
.menu-grid  {
  display: grid;
  gap: 10px;
  padding: 0;
  margin: 0;
  list-style: none;
}
.menu-grid li  {
  min-width: 0;
}
.destination-card  {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) 12px;
  align-items: center;
  gap: 12px;
  height: 100%;
  min-height: 88px;
  padding: 10px 12px;
  border: 3px solid var(--gold);
  background: var(--card-background);
  box-shadow: 4px 4px 0 var(--gold-deep);
  color: var(--text);
  text-decoration: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 120ms ease, transform 120ms ease, box-shadow 120ms ease;
}
.card-icon  {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
}
.card-icon svg  {
  width: 32px;
  height: 32px;
  overflow: visible;
}
.card-copy  {
  min-width: 0;
  min-height: 0;
}
.destination-title  {
  margin: 0 0 4px;
  color: var(--gold-light);
  font-size: 17px;
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: .025em;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
.destination-description  {
  margin: 0;
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.4;
  letter-spacing: 0;
}
.card-arrow  {
  width: 12px;
  height: 18px;
  color: var(--gold);
}
.destination-card:focus-visible  {
  outline: 3px solid var(--focus);
  outline-offset: 6px;
}
.destination-card:active  {
  transform: translate(3px, 3px);
  box-shadow: 1px 1px 0 var(--gold-deep);
}
.route-dots  {
  animation: route-flow 4s linear infinite;
}
.route-pin  {
  animation: pin-bob 4s steps(3, end) infinite;
}
.door-panel  {
  transform-origin: 6px 14px;
  animation: door-open 6.3s steps(4, end) infinite;
}
.door-key  {
  animation: key-bob 6.3s steps(3, end) infinite;
}
.wheel-turn  {
  transform-origin: 15px 15px;
  animation: wheel-turn 7.5s ease-in-out infinite;
}
.bead-first  {
  animation: bead-right 6.9s steps(3, end) infinite;
}
.bead-second  {
  animation: bead-left 6.9s steps(3, end) infinite;
}
@keyframes tree-bob  {
  40%, 60%  {
    transform: translateY(-4px);
  }
}
@keyframes route-flow  {
  to  {
    stroke-dashoffset: -20;
  }
}
@keyframes pin-bob  {
  50%  {
    transform: translateY(-1px);
  }
}
@keyframes door-open  {
  0%, 20%, 70%, 100%  {
    transform: none;
  }
  35%, 55%  {
    transform: scaleX(.55);
  }
}
@keyframes key-bob  {
  0%, 20%, 70%, 100%  {
    transform: none;
  }
  35%, 55%  {
    transform: translateY(-2px);
  }
}
@keyframes wheel-turn  {
  0%, 18%  {
    transform: rotate(0);
  }
  55%, 100%  {
    transform: rotate(360deg);
  }
}
@keyframes bead-right  {
  0%, 15%, 80%, 100%  {
    transform: none;
  }
  35%, 60%  {
    transform: translateX(7px);
  }
}
@keyframes bead-left  {
  0%, 15%, 80%, 100%  {
    transform: none;
  }
  35%, 60%  {
    transform: translateX(-7px);
  }
}
@media (min-width: 760px)  {
  .menu-shell  {
    padding-top: calc(48px + env(safe-area-inset-top, 0px));
  }
  .menu-header  {
    margin-bottom: 38px;
  }
  .menu-grid  {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px;
  }
  .destination-card  {
    min-height: 148px;
    gap: 16px;
    padding: 24px 22px;
  }
}
@media (max-width: 759px) and (max-height: 700px) {
  .christmas-mark { width: 24px; height: 27px; margin-bottom: 4px; }
  .menu-header { margin-bottom: 12px; }
  h1 { font-size: 28px; }
  .friendship { margin: 4px 0 6px; }
  .trip-dates { padding: 3px 9px; }
  .menu-grid { gap: 8px; }
  .destination-card { padding: 8px 10px; gap: 10px; grid-template-columns: 34px minmax(0, 1fr) 10px; }
  .card-icon { width: 34px; height: 34px; }
  .destination-title { font-size: 16px; }
  .brand-signature { padding-top: 12px; }
}
@media (max-width: 759px) and (max-height: 600px) {
  .christmas-mark { width:20px; height:23px; }
  .menu-header { margin-bottom:8px; }
  .friendship { margin:4px 0; }
  .trip-dates { padding:2px 9px; }
  .menu-grid { gap:6px; }
  .destination-card { min-height:84px; padding-block:7px; }
  .brand-signature { padding-top:8px; }
}
@media (min-width: 760px) and (max-height: 500px) {
  .menu-shell { padding-top:max(10px,env(safe-area-inset-top,0px)); padding-bottom:max(10px,env(safe-area-inset-bottom,0px)); }
  .menu-header { margin-bottom:12px; }
  .christmas-mark { width:20px; height:23px; margin-bottom:4px; }
  h1 { font-size:28px; }
  .friendship { margin:4px 0; }
  .trip-dates { padding:2px 9px; }
  .menu-grid { gap:12px; }
  .destination-card { min-height:88px; padding:8px 12px; gap:12px; }
  .destination-title { font-size:16px; }
  .brand-signature { padding-top:8px; }
}
@media (hover: hover) and (pointer: fine)  {
  .destination-card:hover  {
    background: var(--card-hover);
    transform: translate(-1px, -1px);
    box-shadow: 5px 5px 0 var(--gold-deep);
  }
  .destination-card:active  {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 var(--gold-deep);
  }
}
@media (prefers-reduced-motion: reduce)  {
  *, *::before, *::after  {
    animation: none !important;
    transition: none !important;
  }
  .destination-card:hover  {
    transform: none;
  }
}
/* A quiet signature below the four destinations. */
.brand-signature  {
  display: flex;
  justify-content: center;
  margin-top: auto;
  padding-top: 16px;
  line-height: 0;
}
.brand-signature img  {
  display: block;
  width: 88px;
  max-width: 100%;
  height: auto;
}
</style>
